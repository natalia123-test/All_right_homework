name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check and run browser tests
        run: |
          npm run typecheck
          npm run test:chromium
        env:
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check and run API tests
        run: |
          npm run typecheck
          npm run test:api

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-api-report/
          if-no-files-found: warn
          retention-days: 14
